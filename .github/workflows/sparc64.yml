name: Test on SPARC64

on:
  push:
    branches: [sparc64]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5

      - name: Install QEMU and debootstrap
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support debootstrap

          # Ubuntu 24.04 contains an old Debian Ports archive keyring.
          curl -fsSLO https://deb.debian.org/debian/pool/main/d/debian-ports-archive-keyring/debian-ports-archive-keyring_2026.02.04_all.deb
          sudo dpkg -i debian-ports-archive-keyring_2026.02.04_all.deb

      - name: Create Debian SPARC64 environment
        run: |
          sudo qemu-debootstrap \
            --arch=sparc64 \
            --variant=minbase \
            --keyring=/usr/share/keyrings/debian-ports-archive-keyring.gpg \
            unstable /tmp/debian-sparc64 \
            https://deb.debian.org/debian-ports/

          sudo cp -a "$GITHUB_WORKSPACE" /tmp/debian-sparc64/project

      - name: Build and test
        run: |
          sudo chroot /tmp/debian-sparc64 /bin/bash -ex <<'EOF'
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y \
              build-essential python3-dev python3-setuptools
            cd /project
            python3 setup.py build_ext --inplace
            python3 -c 'import bitarray; assert bitarray.test().wasSuccessful()'
          EOF
