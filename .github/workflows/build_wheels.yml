name: Build and upload to PyPI

on: [push, pull_request]

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: auto
          - os: ubuntu-latest
            arch: ppc64le
          - os: ubuntu-latest
            arch: riscv64
          - os: ubuntu-latest
            arch: s390x
          - os: ubuntu-24.04-arm
            arch: auto
          - os: windows-latest
            arch: auto
          - os: windows-11-arm
            arch: auto
          # macos-15-intel is Intel, macos-15 is Apple silicon (ARM64)
          - os: macos-15-intel
            arch: auto
          - os: macos-15
            arch: auto

    steps:
      - uses: actions/checkout@v5

      - name: Set up QEMU
        if: runner.os == 'Linux' && matrix.arch != 'auto'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.1
        # to supply options, put them in 'env', like:
        env:
          CIBW_ENABLE: pypy
          CIBW_ARCHS_LINUX: ${{ matrix.arch }}
          CIBW_TEST_COMMAND: python -c "import bitarray; assert bitarray.test().wasSuccessful()"

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_pyodide:
    name: Build Pyodide wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build Pyodide wheel
        uses: pypa/cibuildwheel@v4.3.1
        env:
          CIBW_PLATFORM: pyodide
          CIBW_TEST_COMMAND: python -c "import bitarray; assert bitarray.test().wasSuccessful()"

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-pyodide
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  upload_pypi:
    needs: [build_wheels, build_pyodide, build_sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    # upload to PyPI on every tag
    if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
